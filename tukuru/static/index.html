<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tukuru - Robo hormiga</title>
<style>
  :root { --bg:#0f1419; --card:#1a2129; --line:#2a3440; --txt:#e6edf3; --mut:#8b98a5; --ok:#3fb950; --warn:#f0a020; --bad:#f85149; --acc:#4493f8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0; } h2 { font-size:15px; margin:0 0 8px; }
  .pill { padding:2px 10px; border-radius:99px; background:var(--card); border:1px solid var(--line); color:var(--mut); font-size:12px; }
  .pill.ok { color:var(--ok); } .pill.warn { color:var(--warn); } .pill.bad { color:var(--bad); }
  main { padding:16px; display:grid; gap:16px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; min-width:0; }
  .wide { grid-column: 1 / -1; }
  img.video { width:100%; border-radius:6px; background:#000; display:block; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:5px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--mut); font-weight:500; }
  .lvl-ok { color:var(--ok); } .lvl-observacion { color:var(--mut); } .lvl-posible_ocultamiento { color:var(--warn); font-weight:600; } .lvl-probable_sustraccion { color:var(--bad); font-weight:700; }
  .alert { display:flex; gap:10px; padding:8px; border:1px solid var(--line); border-left-width:4px; border-radius:6px; margin-bottom:8px; }
  .alert.probable_sustraccion { border-left-color:var(--bad); } .alert.posible_ocultamiento { border-left-color:var(--warn); }
  .alert.sistema { border-left-color:var(--acc); }
  .alert img { width:96px; height:64px; object-fit:cover; border-radius:4px; }
  .alert .meta { color:var(--mut); font-size:12px; }
  .alert.acked { opacity:.55; }
  form { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:8px; }
  label { display:flex; flex-direction:column; font-size:12px; color:var(--mut); gap:3px; }
  input, select, textarea { background:var(--bg); color:var(--txt); border:1px solid var(--line); border-radius:5px; padding:6px 8px; font:inherit; }
  button { background:var(--acc); color:#fff; border:0; border-radius:5px; padding:7px 12px; font:inherit; cursor:pointer; }
  button.sec { background:var(--card); border:1px solid var(--line); color:var(--txt); }
  button.del { background:var(--bad); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .msg { font-size:13px; } .msg.ok { color:var(--ok); } .msg.bad { color:var(--bad); }
  .empty { color:var(--mut); }
</style>
</head>
<body>
<header>
  <h1>Tukuru</h1>
  <span class="pill" id="gem">Gemini: ...</span>
  <span class="pill" id="alertsPill">Alertas: 0</span>
  <button class="sec" id="soundBtn">Activar sonido de alerta</button>
</header>
<main>
  <section class="card wide" id="videos"><h2>Camaras</h2><div class="empty" id="noCams">Sin camaras. Agregue una abajo.</div></section>
  <section class="card"><h2>Personas detectadas</h2><div id="people" class="empty">Sin personas en escena.</div></section>
  <section class="card"><h2>Alertas</h2><div id="alerts" class="empty">Sin alertas.</div></section>
  <section class="card wide">
    <h2 id="formTitle">Agregar camara</h2>
    <form id="camForm" autocomplete="off">
      <label style="grid-column:1/-1">URL completa (opcional, rellena el resto): rtsp://usuario:contrasena@192.168.1.64:554/ruta<input name="url" maxlength="512" placeholder="rtsp://admin:clave@192.168.1.64:554/Streaming/Channels/102"></label>
      <label>ID (opcional)<input name="id" maxlength="32" placeholder="CAM-01"></label>
      <label>Nombre<input name="name" maxlength="60" placeholder="Pasillo 1 - Bebidas"></label>
      <label>Protocolo<select name="protocol"><option>rtsp</option><option>rtsps</option><option>http</option><option>https</option></select></label>
      <label>Marca (ruta del stream)<select name="brand"></select></label>
      <label>IP / host<input name="host" placeholder="192.168.1.64"></label>
      <label>Puerto<input name="port" type="number" min="1" max="65535" placeholder="554"></label>
      <label>Usuario<input name="user" maxlength="64"></label>
      <label>Contrasena<input name="password" type="password" maxlength="128" autocomplete="new-password" placeholder="(sin cambios si se edita)"></label>
      <label style="flex-direction:row;align-items:center;gap:6px"><input name="enabled" type="checkbox" checked>Habilitada</label>
      <label>Ruta (opcional)<input name="path" maxlength="256" placeholder="/Streaming/Channels/102"></label>
      <label style="grid-column:1/-1">Zonas (JSON opcional: estanteria, caja, salida, personal; coordenadas 0-1)<textarea name="zones" rows="3" placeholder='{"estanteria":[[[0.0,0.2],[0.4,0.2],[0.4,0.8],[0.0,0.8]]],"salida":[[[0.8,0.6],[1,0.6],[1,1],[0.8,1]]]}'></textarea></label>
    </form>
    <div class="row" style="margin-top:10px">
      <button id="testBtn" type="button" class="sec">Probar conexion</button>
      <button id="saveBtn" type="button">Guardar y conectar</button>
      <button id="clearBtn" type="button" class="sec">Nueva / limpiar</button>
      <span class="msg" id="camMsg"></span>
    </div>
    <div class="meta" id="credInfo" style="margin-top:8px"></div>
    <div id="camList" style="margin-top:12px"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const api = async (url, opts = {}) => {
  const r = await fetch(url, { ...opts, headers: { "Content-Type": "application/json", "X-Requested-With": "tukuru" } });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || data.message || ("HTTP " + r.status));
  return data;
};
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const LEVEL = { ok: "normal", observacion: "observacion", posible_ocultamiento: "POSIBLE OCULTAMIENTO", probable_sustraccion: "PROBABLE SUSTRACCION" };

["generico","hikvision","dahua","tapo","reolink","uniview","axis"].forEach(b => { const o = el("option", "", b); o.value = b; document.querySelector("[name=brand]").append(o); });

let soundOn = false, ctx = null, seenAlerts = null;
$("soundBtn").onclick = () => { soundOn = !soundOn; if (soundOn && !ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); $("soundBtn").textContent = soundOn ? "Sonido activado" : "Activar sonido de alerta"; };
function beep(critical) {
  if (!soundOn || !ctx) return;
  [0, 0.35, 0.7].forEach(t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = critical ? 960 : 640; g.gain.value = 0.15; o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.25); });
}

const cams = {};
function renderCameras(list) {
  $("noCams").style.display = list.length ? "none" : "";
  const grid = $("videos");
  for (const c of list) {
    const id = c.camera.id;
    let box = cams[id];
    if (!box) {
      box = cams[id] = { root: el("div"), title: el("div", "meta"), img: el("img", "video") };
      box.root.style.cssText = "display:inline-block;width:calc(50% - 8px);min-width:300px;vertical-align:top;margin:0 8px 8px 0";
      box.root.append(box.title, box.img); grid.append(box.root);
      box.img.src = "/stream/" + encodeURIComponent(id);
    }
    const st = c.stream || {};
    const state = { connected: "conectada", reconnecting: "SIN SENAL", connecting: "conectando", disabled: "deshabilitada" }[st.state] || st.state;
    box.title.textContent = `${c.camera.name} (${id}) - ${state} - ${c.fps || 0} fps analisis` + (c.dark_mode ? " - modo nocturno" : "");
    box.title.style.color = st.state === "connected" ? "var(--mut)" : "var(--bad)";
  }
  for (const id of Object.keys(cams)) if (!list.find(c => c.camera.id === id)) { cams[id].root.remove(); delete cams[id]; }
}

function renderPeople(list) {
  const rows = [];
  for (const c of list) for (const p of c.people) rows.push([c.camera.name, p]);
  const box = $("people"); box.replaceChildren();
  if (!rows.length) { box.className = "empty"; box.textContent = "Sin personas en escena."; return; }
  box.className = "";
  const t = el("table"), head = el("tr");
  ["Camara","ID","Estado","Punt.","Alcances","Ocultam.","Lugar","Giros cab.","Caja","Gemini"].forEach(h => head.append(el("th", "", h)));
  t.append(head);
  for (const [cam, p] of rows) {
    const tr = el("tr");
    const verdict = p.verdict ? `${p.verdict.state} - ${p.verdict.action} (${Math.round(p.verdict.confidence * 100)}%)` : "-";
    [cam, p.id, p.staff ? "personal" : (LEVEL[p.level] || p.level), p.puntuacion_local, p.alcances_2min, p.ocultamientos, p.lugar_ocultamiento || "-", p.giros_de_cabeza, p.paso_por_caja ? "si" : "no", verdict].forEach((v, i) => {
      const td = el("td", i === 2 ? "lvl-" + p.level : "", String(v)); tr.append(td);
    });
    t.append(tr);
  }
  box.append(t);
}

function renderAlerts(list) {
  const box = $("alerts"); box.replaceChildren();
  if (!list.length) { box.className = "empty"; box.textContent = "Sin alertas."; return; }
  box.className = "";
  for (const a of list.slice(0, 15)) {
    const d = el("div", "alert " + a.level + (a.ack ? " acked" : ""));
    if (a.snapshot) { const i = el("img"); i.src = "/evidence/" + encodeURIComponent(a.snapshot); i.loading = "lazy"; d.append(i); }
    const body = el("div"); body.style.flex = "1";
    const who = a.track_id != null ? ` - persona ID ${a.track_id}` : "";
    body.append(el("div", "lvl-" + a.level, (LEVEL[a.level] || a.level.toUpperCase()) + (a.shadow ? " (sombra)" : "") + " - " + a.camera_name + who));
    body.append(el("div", "", a.reason || ""));
    body.append(el("div", "meta", a.iso.replace("T", " ") + (a.source ? " - fuente: " + a.source : "")));
    if (!a.ack) { const b = el("button", "sec", "Reconocer"); b.onclick = async () => { await api("/api/alerts/" + a.id + "/ack", { method: "POST", body: "{}" }); refresh(); }; body.append(b); }
    d.append(body); box.append(d);
  }
}

async function refresh() {
  try {
    const [st, alerts] = await Promise.all([api("/api/status"), api("/api/alerts?limit=30")]);
    renderCameras(st.cameras); renderPeople(st.cameras); renderAlerts(alerts);
    const g = st.gemini;
    $("gem").textContent = g.active ? `Gemini: activo (${g.calls} consultas, ${g.tokens} tokens)` : `Gemini: apagado (${g.disabled_reason}) - solo heuristica local`;
    $("gem").className = "pill " + (g.active ? "ok" : "warn");
    $("alertsPill").textContent = "Alertas sin reconocer: " + st.active_alerts;
    $("alertsPill").className = "pill " + (st.active_alerts ? "bad" : "ok");
    const ids = new Set(alerts.map(a => a.id));
    if (seenAlerts) alerts.filter(a => !seenAlerts.has(a.id) && !a.shadow).forEach(a => beep(a.level === "probable_sustraccion"));
    seenAlerts = ids;
    renderCamList(st.cameras, st.credentials_store);
  } catch (e) { $("alertsPill").textContent = "Sin conexion con el servidor"; $("alertsPill").className = "pill bad"; }
}

const PORTS = { rtsp: 554, rtsps: 322, http: 80, https: 443 };
const form = () => $("camForm");
const setPortHint = () => { form().elements.port.placeholder = PORTS[form().elements.protocol.value] || ""; };
form().elements.protocol.onchange = setPortHint; setPortHint();

function formData() {
  const fe = form().elements, f = {};
  for (const k of ["id","name","protocol","brand","host","port","user","password","path","url"]) { const v = fe[k].value.trim(); if (v) f[k] = v; }
  f.enabled = fe.enabled.checked;
  const z = fe.zones.value.trim();
  if (z) { try { f.zones = JSON.parse(z); } catch { throw new Error("Zonas: JSON invalido"); } } else f.zones = {};
  return f;
}
function resetForm() {
  form().reset(); form().elements.id.readOnly = false; form().elements.enabled.checked = true;
  $("formTitle").textContent = "Agregar camara"; setPortHint();
}
function say(cls, text) { const m = $("camMsg"); m.className = "msg " + cls; m.textContent = text; }
async function run(btn, working, job) {
  const buttons = [$("testBtn"), $("saveBtn")]; buttons.forEach(b => b.disabled = true); say("", working);
  try { await job(); } catch (e) { say("bad", e.message); } finally { buttons.forEach(b => b.disabled = false); }
}
$("testBtn").onclick = () => run($("testBtn"), "Probando conexion (hasta 12 s)...", async () => {
  const r = await api("/api/cameras/test", { method: "POST", body: JSON.stringify(formData()) });
  say(r.ok ? "ok" : "bad", r.message);
});
$("saveBtn").onclick = () => run($("saveBtn"), "Guardando...", async () => {
  const saved = await api("/api/cameras", { method: "POST", body: JSON.stringify(formData()) });
  resetForm(); say("ok", `Camara ${saved.name} (${saved.id}) guardada. Conectando...`); refresh();
});
$("clearBtn").onclick = () => { resetForm(); say("", ""); };

function editCamera(c) {
  const fe = form().elements;
  for (const k of ["id","name","protocol","brand","host","user","path"]) fe[k].value = c[k] ?? "";
  fe.port.value = c.port || ""; fe.url.value = ""; fe.password.value = "";
  fe.enabled.checked = c.enabled; fe.id.readOnly = true;
  fe.zones.value = c.zones ? JSON.stringify(c.zones) : "";
  $("formTitle").textContent = "Editando " + c.id; setPortHint(); say("", "");
  form().scrollIntoView({ behavior: "smooth" });
}

let lastCamKey = "";
const STATE = { connected: "conectada", reconnecting: "SIN SENAL", connecting: "conectando", disabled: "deshabilitada" };
function renderCamList(list, creds) {
  $("credInfo").textContent = creds === "keyring" ? "Las contrasenas se guardan cifradas en el llavero del sistema (no en data/cameras.json)."
    : "Sin llavero en este equipo: las contrasenas quedan en data/cameras.json. Proteja la carpeta data/.";
  const key = JSON.stringify(list.map(c => [c.camera, c.stream && c.stream.state, c.stream && c.stream.last_error]));
  if (key === lastCamKey) return; lastCamKey = key;
  const box = $("camList"); box.replaceChildren();
  for (const item of list) {
    const c = item.camera, st = item.stream || {};
    const row = el("div", "row"); row.style.marginBottom = "6px";
    const state = el("span", "pill " + (st.state === "connected" ? "ok" : st.state === "disabled" ? "" : "bad"), STATE[st.state] || st.state);
    row.append(el("span", "pill", c.id), state, el("span", "", c.name + " - " + c.url));
    if (st.last_error && st.state !== "connected") row.append(el("span", "meta", st.last_error));
    const edit = el("button", "sec", "Editar"); edit.onclick = () => editCamera(c);
    const toggle = el("button", "sec", c.enabled ? "Deshabilitar" : "Habilitar");
    toggle.onclick = async () => { toggle.disabled = true; try { await api("/api/cameras/" + encodeURIComponent(c.id) + "/enabled", { method: "POST", body: JSON.stringify({ enabled: !c.enabled }) }); } catch (e) { say("bad", e.message); } refresh(); };
    const del = el("button", "del", "Eliminar"); del.onclick = async () => { if (confirm("Eliminar " + c.name + "? Tambien se borra su contrasena guardada.")) { try { await api("/api/cameras/" + encodeURIComponent(c.id), { method: "DELETE" }); } catch (e) { say("bad", e.message); } refresh(); } };
    row.append(edit, toggle, del); box.append(row);
  }
}
refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
